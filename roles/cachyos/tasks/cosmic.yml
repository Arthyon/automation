- name: copy cosmic settings
  copy:
    src: "cosmic/{{item}}"
    dest: /home/{{ ansible_facts['user_id'] }}/.config/cosmic/{{item}}
  with_items:
    - com.system76.CosmicAppletTime/v1/first_day_of_week
    - com.system76.CosmicAppletTime/v1/military_time
    - com.system76.CosmicBackground/v1/same-on-all
    - com.system76.CosmicComp/v1/autotile
    - com.system76.CosmicComp/v1/autotile_behavior
    - com.system76.CosmicComp/v1/cursor_follows_focus
    - com.system76.CosmicComp/v1/workspaces
    - com.system76.CosmicComp/v1/xkb_config
    - com.system76.CosmicIdle/v1/suspend_on_ac_time
    - com.system76.CosmicSettings.Shortcuts/v1/custom
    - com.system76.CosmicTheme.Dark/v1/gaps
    - com.system76.CosmicTheme.Mode/v1/is_dark
